name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        working-directory: app
        run: pytest -v

  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r app/requirements.txt

  image-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image for scanning
        run: docker build -t platform-lab-api:scan ./app

      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: platform-lab-api:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          trivyignores: .trivyignore

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: false
          tags: platform-lab-api:ci

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - dependency-scan
      - image-scan
      - docker-build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate image name
        id: image
        shell: bash
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER}/platform-lab-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |             docker login ghcr.io               --username "${{ github.actor }}"               --password-stdin

      - name: Build image
        run: |
          docker build             -t "${{ steps.image.outputs.name }}:${{ github.sha }}"             -t "${{ steps.image.outputs.name }}:main"             ./app

      - name: Push immutable image
        run: docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"

      - name: Push main image
        run: docker push "${{ steps.image.outputs.name }}:main"
